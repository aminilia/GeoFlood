name: CI

# Mirrors the GitLab stage order: validate -> test -> build -> scan -> package -> docs.
on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: black --check src tests scripts
      - run: mypy src

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python scripts/generate_sample_data.py
      - run: >-
          pytest --cov=geoflood --cov-report=term-missing
          --cov-report=xml:coverage.xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      - run: docker build --tag geoflood:${{ github.sha }} .

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Dependency audit (advisory)
        run: pip-audit
        continue-on-error: true
      - run: docker build --tag geoflood:${{ github.sha }} .
      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: geoflood:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,pipeline]"
      - run: python scripts/generate_sample_data.py
      - name: Demo scenario (v1)
        run: >-
          geoflood run --dem tests/data/sample_dem.tif --water-level 3.2
          --output outputs/demo_flood_depth.tif
          --zones tests/data/sample_zones.geojson
          --summary outputs/demo_zonal_stats.csv
          --report outputs/demo_report.json
      - name: Feature pipeline (v2 Phase 1)
        run: dvc repro features_norfolk
      - name: Pipeline is reproducible
        run: dvc status features_norfolk
      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            outputs/demo_*
            outputs/features/norfolk/features.json
          retention-days: 7

  docs:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: mkdocs build --strict
