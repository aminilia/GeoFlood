stages:
  features_norfolk:
    desc: Terrain, hydrology, and coastal features for the Norfolk study area
    cmd: >-
      geoflood features
      --dem ${norfolk.dem}
      --output-dir outputs/features/norfolk
      --water-threshold ${norfolk.water_threshold}
      --reference-level ${norfolk.reference_level}
      --scenario-level ${norfolk.scenario_level_low}
      --scenario-level ${norfolk.scenario_level_high}
      --stream-threshold ${norfolk.stream_threshold}
    deps:
      - ${norfolk.dem}
      - data/norfolk_elizabeth_river_dem.json
      - src/geoflood/features
      - src/geoflood/raster.py
    params:
      - norfolk
    outs:
      - outputs/features/norfolk/features.tif
      - outputs/features/norfolk/features.parquet
    metrics:
      - outputs/features/norfolk/features.json:
          cache: false

  labels_norfolk:
    desc: FEMA NFHL flood-zone labels on the Norfolk DEM grid
    # data/nfhl/norfolk_nfhl.* come from `python scripts/download_nfhl.py`
    cmd: >-
      geoflood labels
      --dem ${norfolk.dem}
      --zones data/nfhl/norfolk_nfhl.geojson
      --output-dir outputs/labels/norfolk
    deps:
      - ${norfolk.dem}
      - data/nfhl/norfolk_nfhl.geojson
      - data/nfhl/norfolk_nfhl.json
      - src/geoflood/labels
    outs:
      - outputs/labels/norfolk/labels.tif
    metrics:
      - outputs/labels/norfolk/labels.json:
          cache: false
